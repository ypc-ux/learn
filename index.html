<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julius Learn Hub — Interactive Knowledge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0B1426;color:#e5e5e5;min-height:100vh;padding:24px;line-height:1.6;-webkit-font-smoothing:antialiased;width:100%;overflow-x:hidden}
h1,h2,h3{font-family:Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
a{color:#0693e3;text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:900px;margin:0 auto;padding:40px 24px}
.hero{text-align:center;padding:60px 0 40px;border-bottom:1px solid rgba(6,147,227,.15);margin-bottom:40px}
.hero h1{font-size:3rem;color:#fff;font-weight:300;margin-bottom:12px}
.hero .sub{color:#0693e3;text-transform:uppercase;letter-spacing:.3em;font-size:.75rem;margin-bottom:20px}
.hero .desc{color:rgba(255,255,255,.4);max-width:640px;margin:0 auto}
.card{background:#0f1a2e;border:1px solid rgba(6,147,227,.15);border-radius:16px;padding:28px;margin-bottom:20px;transition:border-color .3s,transform .3s}
.card:hover{border-color:rgba(6,147,227,.4);transform:translateY(-4px)}
.card h2{font-size:1.3rem;color:#fff;margin-bottom:8px}
.card p{color:rgba(255,255,255,.4);font-size:.9rem}
.card .tag{display:inline-block;font-size:.65rem;padding:3px 10px;border-radius:100px;background:rgba(6,147,227,.15);color:#0693e3;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;font-weight:600}
.card .link{display:inline-block;margin-top:10px;color:#0693e3;font-size:.85rem;font-weight:600}
h3.section{font-size:1rem;color:#0693e3;text-transform:uppercase;letter-spacing:.2em;margin:36px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(6,147,227,.1)}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.85rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
th{background:#0f1a2e;color:#0693e3;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}
td{color:rgba(255,255,255,.5)}td strong{color:#fff}
blockquote{border-left:3px solid #0693e3;padding:12px 20px;margin:16px 0;background:#0f1a2e;border-radius:0 12px 12px 0;color:rgba(255,255,255,.6);font-style:italic}
blockquote strong{color:#8ed1fc}
.callout{background:rgba(6,147,227,.08);border:1px solid rgba(6,147,227,.2);border-radius:12px;padding:20px;margin:20px 0}
.callout strong{color:#0693e3}
footer{text-align:center;padding:40px 24px;border-top:1px solid rgba(6,147,227,.1);margin-top:60px;color:rgba(255,255,255,.2);font-size:.8rem}
</style>
</head>
<body>
<div class="container">
<div class="hero">
<div class="sub">Julius Young III · AI Studio</div>
<h1>Learn Hub</h1>
<p class="desc">Interactive knowledge documents. I learn by building products. Every framework here is applied to a real product in the studio.</p>
</div>
</div>
